    <main>

      <!-- Hero contact card -->
      <section class="contact-hero d-flex flex-column align-items-center justify-content-center text-center mt-5 mb-5 p-5">
        <h1 class="mb-1">Parker McKillop</h1>

          </a>

      <!-- Contact form -->
      <section class="mb-5">
        <h2 class="mb-4">Send a Message</h2>
        <div id="form-status" class="mb-3" style="display:none;"></div>
        <form id="contact-form">
          <div class="mb-3">
            <label for="email" class="form-label">Your Email</label>
            <input type="email" class="form-control contact-input" id="email" name="email" placeholder="you@example.com" required>
          </div>
          <div class="mb-3">
            <label for="subject" class="form-label">Subject</label>
            <input type="text" class="form-control contact-input" id="subject" name="subject" placeholder="What's this about?" required>
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea class="form-control contact-input" id="message" name="message" rows="5" placeholder="Your message..." required></textarea>
          </div>
          <button type="submit" class="btn contact-btn">Send Message</button>
        </form>
      </section>

      <!---Ajax contact form submission to formspree, this prevents the formspree confirmation page
      from appearing, and also allows me to clear the text area post submission, I'd originally set it up with the simplest
      formspree config found here: https://developers.cloudflare.com/pages/tutorials/add-an-html-form-with-formspree -->
      <script>
        document.getElementById('contact-form').addEventListener('submit', async function (e) {
          e.preventDefault();
          const form = e.target;
          const status = document.getElementById('form-status');
          const btn = form.querySelector('button[type="submit"]');
          btn.disabled = true;
          try {
            const res = await fetch('https://formspree.io/f/xzdwerkp', {
              method: 'POST',
              body: new FormData(form),
              headers: { 'Accept': 'application/json' }
            });
            if (res.ok) {
              status.textContent = 'Message sent! I\'ll get back to you soon.';
              status.className = 'mb-3 alert alert-success';
              status.style.display = '';
              form.reset();
            } else {
              throw new Error('Server error');
            }
          } catch {
            status.textContent = 'Something went wrong. Please try emailing me directly.';
            status.className = 'mb-3 alert alert-danger';
            status.style.display = '';
          }
          btn.disabled = false;
        });
      </script>
